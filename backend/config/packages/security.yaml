security:
    password_hashers:
        App\Entity\Utilisateur: 'auto'
    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
            
            logout:
                path: app_logout
            
            # Activer l'authentification stateless pour API
            stateless: true
    
    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }