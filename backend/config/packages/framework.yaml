framework:
    secret: "%env(APP_SECRET)%"

    # Session configuration for CORS
    session:
        handler_id: null
        cookie_secure: false # false for HTTP, true for HTTPS
        cookie_samesite: "lax" # or 'none' if needed
        storage_factory_id: session.storage.factory.native

    # Other framework settings
    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
