doctrine:
    dbal:
        # ✅ Connexion à ta base MySQL
        url: '%env(resolve:DATABASE_URL)%'

        # ✅ Indique explicitement le type de serveur
        driver: 'pdo_mysql'
        charset: utf8mb4
        server_version: '8.0' # adapte si tu utilises MySQL 5.7 ou MariaDB (par ex : 'mariadb-10.6')

        # ✅ Active les transactions avancées et le profiling
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

    orm:
        # ✅ Génération automatique des proxies
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware

        # ✅ Mapping automatique vers ton dossier des entités
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute # ou "annotation" si tu utilises les anciennes annotations
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
